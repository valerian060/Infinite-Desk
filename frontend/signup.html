<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Infinite Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: auto;
            min-height: 100vh;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(180deg, #0d1117 0%, #000000 100%);
            color: #edf2f4;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 40px 20px;
        }

        /* Starfield Background */
        .star-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        .star:nth-child(3n) {
            width: 1px;
            height: 1px;
            animation-duration: 10s;
        }

        .star:nth-child(3n + 1) {
            width: 2px;
            height: 2px;
            animation-duration: 15s;
            background: #00f2ff;
        }

        .star:nth-child(3n + 2) {
            width: 3px;
            height: 3px;
            animation-duration: 8s;
            background: #cdb4db;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Signup Container */
        .signup-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 50px 40px;
            background: rgba(13, 17, 23, 0.8);
            border: 2px solid rgba(0, 242, 255, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            animation: fadeInScale 0.8s ease-out;
            margin: 20px auto;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.5rem;
            color: #00f2ff;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        .logo p {
            font-size: 0.9rem;
            color: #edf2f4;
            font-weight: 300;
        }

        .form-title {
            font-size: 1.8rem;
            color: #00f2ff;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            color: #edf2f4;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            background: rgba(237, 242, 244, 0.05);
            border: 2px solid rgba(0, 242, 255, 0.3);
            border-radius: 10px;
            color: #edf2f4;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            background: rgba(237, 242, 244, 0.08);
        }

        .form-group input::placeholder {
            color: rgba(237, 242, 244, 0.5);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00f2ff;
        }

        .checkbox-group label {
            font-size: 0.85rem;
            color: #edf2f4;
            margin: 0;
        }

        .checkbox-group label a {
            color: #00f2ff;
            text-decoration: none;
        }

        .checkbox-group label a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            background: linear-gradient(135deg, #00f2ff 0%, #00b4d8 100%);
            color: #0d1117;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.7);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #edf2f4;
            font-size: 0.9rem;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(0, 242, 255, 0.3);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #edf2f4;
        }

        .login-link a {
            color: #00f2ff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.8);
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            font-size: 0.9rem;
            color: #edf2f4;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-home a:hover {
            color: #00f2ff;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            .signup-container {
                padding: 40px 25px;
                margin: 0 auto;
            }

            .logo h1 {
                font-size: 2rem;
            }

            .form-title {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Starfield Background -->
    <div class="star-field" id="starfield"></div>

    <div class="signup-container">
        <div class="logo">
            <h1>INFINITE DESK</h1>
            <p>Your Personal Cognitive Cosmos</p>
        </div>

        <h2 class="form-title">Create Your Universe</h2>

        <form action="#" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="John" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
            </div>

            <button type="submit" class="submit-btn">Sign Up</button>
        </form>

        <div class="divider">OR</div>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>

        <div class="back-home">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script>
        // Generate Starfield
        const starfield = document.getElementById('starfield');
        const starCount = 100;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 10 + 's';
            starfield.appendChild(star);
        }
    </script>
</body>
</html>
