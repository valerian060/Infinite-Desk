<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>infinitedesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/lucide-react@0.292.0/dist/umd/lucide-react.min.js"></script>
    
    <style>
        /* Custom font and base styling */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a1a;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* Styling for the SVG visualization elements */
        .node circle {
            stroke: #fff;
            stroke-width: 1.5px;
            transition: transform 0.2s ease-in-out, r 0.2s ease-in-out, fill 0.2s ease;
        }

        .node:hover circle {
            transform: scale(1.2);
        }

        .node.selected circle {
             stroke: #00f2ff;
             stroke-width: 4px;
        }
        
        /* Styles for drag actions */
        .node.deleting circle {
            fill: #ef4444; /* red-500 */
            stroke: #f87171; /* red-400 */
        }
        .node.merging circle {
            fill: #a855f7; /* purple-500 */
            stroke: #c084fc; /* purple-400 */
        }


        .link {
            stroke: #ffffff;
            stroke-opacity: 0.2;
            stroke-width: 1.5px;
        }

        .cluster-label {
            font-size: 16px;
            font-weight: bold;
            fill: #ffffff;
            text-anchor: middle;
            paint-order: stroke;
            stroke: #0a0a1a;
            stroke-width: 4px;
            stroke-linecap: butt;
            stroke-linejoin: miter;
            cursor: pointer;
            transition: font-size 0.2s ease, fill 0.2s ease;
            user-select: none;
        }

        .cluster-label:hover {
            font-size: 20px;
            fill: #00f2ff;
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a4a6a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6a6a8a;
        }

        /* Custom loader animation */
        .loader {
            border: 4px solid #f3f3f330;
            border-top: 4px solid #00f2ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Background starfield effect */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        }
        
        /* Visual cues for drag actions */
        #delete-zone, #merge-zone {
            position: fixed;
            top: 0;
            height: 100%;
            width: 100px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease, background-color 0.3s ease;
            pointer-events: none; /* Important */
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        #delete-zone {
            right: 0;
            background: linear-gradient(to left, rgba(239, 68, 68, 0.5), transparent);
        }
        #merge-zone {
            left: 0;
            background: linear-gradient(to right, rgba(168, 85, 247, 0.5), transparent);
        }
        #delete-zone.active, #merge-zone.active {
            opacity: 1;
        }

        /* --- MOBILE STYLES (New/Modified) --- */
        
        /* Info Panel: On mobile, use a larger portion of the screen width */
        #info-panel {
            width: 100%; /* Default to full width on mobile */
            height: 50vh; /* Use half the viewport height */
            top: auto; /* Override top: 0 */
            bottom: 0; /* Align to the bottom */
            /* Transform is for sliding up/down on mobile */
            transform: translateY(100%); 
            transition: transform 0.3s ease-in-out;
            border-top: 1px solid rgba(255, 255, 255, 0.1); /* Add a border to the top */
            border-left: none; /* Remove left border */
            
        }

        /* Override the translate-x-full class to use translateY for mobile */
        #info-panel.translate-x-full {
             transform: translateY(100%);
        }
        
        /* New class for when the panel is open on mobile */
        #info-panel:not(.translate-x-full) {
             transform: translateY(0);
        }

        /* Desktop Info Panel Styles (re-apply for md and up) */
        @media (min-width: 768px) {
            #info-panel {
                width: 24rem; /* w-96 */
                height: 100%; /* h-full */
                top: 0;
                bottom: auto;
                transform: translateX(100%); /* Use X translation for desktop */
                border-left: 1px solid rgba(255, 255, 255, 0.1);
                border-top: none;
            }
            #info-panel.translate-x-full {
                transform: translateX(100%);
            }
            #info-panel:not(.translate-x-full) {
                 transform: translateX(0);
            }
        }
        
        /* Top-Left Controls: Stack and make wider on small screens */
        .top-controls-container {
             width: calc(100% - 1rem); /* Full width minus padding */
             left: 0.5rem; /* half the padding */
             right: 0.5rem;
        }
        
        /* The contained element for controls: flex-col on mobile */
        .top-controls-content {
            flex-direction: column; 
            gap: 0.5rem; /* Add small gap when stacked */
        }
        
        /* Search input container should take full width on mobile */
        .search-container {
             width: 100%;
        }

        /* Ensure modal containers are full width on mobile */
        #add-node-modal, #rename-cluster-modal, #search-results-modal, #rag-llm-modal, #share-modal {
             max-width: calc(100% - 2rem); /* Keep a margin on the sides */
        }

    </style>

</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- CONFIG ---
            const API_BASE_URL = 'https://valerian060-infinitedesk.hf.space'; //; 
            const DELETE_THRESHOLD = 0.95; // Drag to right 95% of screen to delete
            const MERGE_THRESHOLD = 0.05; // Drag to left 5% of screen to merge

            // --- DOM ELEMENTS ---
            const svg = d3.select("#galaxy-graph");
            let width = window.innerWidth;
            let height = window.innerHeight;
            svg.attr('width', width).attr('height', height);

            const infoPanel = document.getElementById('info-panel');
            const infoContent = document.getElementById('info-content');
            const closePanelBtn = document.getElementById('close-panel-btn');
            const collectionSelector = document.getElementById('collection-selector');
            const reclusterBtn = document.getElementById('recluster-btn');
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const addNodeBtn = document.getElementById('add-node-btn');
            const shareLinkBtn = document.getElementById('share-link-btn'); // NEW REF
            const loaderOverlay = document.getElementById('loader-overlay');
            const loaderText = document.getElementById('loader-text');
            const deleteZone = document.getElementById('delete-zone');
            const mergeZone = document.getElementById('merge-zone');
            
            // Modals
            const modalBackdrop = document.getElementById('modal-backdrop');
            const addNodeModal = document.getElementById('add-node-modal');
            const cancelAddNodeBtn = document.getElementById('cancel-add-node');
            const confirmAddNodeBtn = document.getElementById('confirm-add-node');
            const renameClusterModal = document.getElementById('rename-cluster-modal');
            const cancelRenameClusterBtn = document.getElementById('cancel-rename-cluster');
            const confirmRenameClusterBtn = document.getElementById('confirm-rename-cluster');
            const searchResultsModal = document.getElementById('search-results-modal');
            const closeSearchResultsBtn = document.getElementById('close-search-results');
            
            // NEW Share Modal Refs
            const shareModal = document.getElementById('share-modal');
            const closeShareModalBtn = document.getElementById('close-share-modal');
            const shareLinkOutput = document.getElementById('share-link-output');
            const copyLinkBtn = document.getElementById('copy-link-btn');


            // --- STATE ---
            let currentCollection = null;
            let currentNodes = [];
            let currentLinks = [];
            let selectedNode = null;
            let selectedCluster = null;
            let mergeTargetNode = null;

            // --- D3 SETUP ---
            // Simulation with collision and adjusted forces
            const simulation = d3.forceSimulation()
                .force("link", d3.forceLink().id(d => d.id).distance(60).strength(0.1))
                .force("charge", d3.forceManyBody().strength(-150))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(12)) // Prevent node overlap
                .on("tick", ticked);

            const g = svg.append("g");
            let link = g.append("g").attr("class", "links").selectAll(".link");
            let node = g.append("g").attr("class", "nodes").selectAll(".node");
            let label = g.append("g").attr("class", "labels").selectAll(".cluster-label");
            
            const color = d3.scaleOrdinal(d3.schemeCategory10);

            const zoom = d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
            svg.call(zoom);
            
            // --- API HELPERS ---
            async function apiCall(endpoint, method = 'GET', body = null, showLoader = true, loaderMsg = 'Loading...') {
                if (showLoader) showLoaderWithMessage(loaderMsg);
                try {
                    const options = {
                        method,
                        headers: { 'Content-Type': 'application/json' }
                    };
                    if (body) options.body = JSON.stringify(body);
                    
                    const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        // IMPORTANT: Replacing alert() with custom message output
                        console.error('API Error:', errorData.detail || `HTTP error! status: ${response.status}`);
                        showCustomMessage(errorData.detail || `HTTP error! status: ${response.status}`, 'error');
                        throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                    }
                    const contentType = response.headers.get("content-type");
                    if (contentType && contentType.indexOf("application/json") !== -1) {
                        return await response.json();
                    } else {
                        return { success: true }; 
                    }

                } catch (error) {
                    console.error('API Call Error:', error);
                    return null;
                } finally {
                     if (showLoader) hideLoader();
                }
            }
            
            // Custom Message Box function (REPLACING alert)
            // UPDATED: Added glassy, sleek styling with backdrop blur
            function showCustomMessage(message, type = 'info') {
                const modal = document.createElement('div');
                
                let bgColorClass = 'bg-blue-600/50 border-blue-400/30'; // Info: Blue/Cyan
                if (type === 'error') {
                    bgColorClass = 'bg-red-600/50 border-red-400/30'; // Error: Red
                } else if (type === 'success') {
                    bgColorClass = 'bg-green-600/50 border-green-400/30'; // Success: Green
                }
                
                modal.className = `fixed top-4 left-1/2 transform -translate-x-1/2 z-[9999] 
                                   p-4 rounded-xl shadow-2xl text-white font-medium 
                                   backdrop-blur-lg border ${bgColorClass} 
                                   transition-opacity duration-300 ease-out opacity-0`;
                
                modal.textContent = message;
                document.body.appendChild(modal);
                
                // Animate in
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modal.classList.add('opacity-100');
                }, 10);
                
                // Animate out and remove
                setTimeout(() => {
                    modal.classList.remove('opacity-100');
                    modal.classList.add('opacity-0');
                    setTimeout(() => modal.remove(), 300); // Wait for transition to finish
                }, 4000);
            }


            // --- UI FUNCTIONS ---
            function showLoaderWithMessage(message) {
                loaderText.textContent = message;
                loaderOverlay.classList.remove('hidden');
            }
            function hideLoader() {
                loaderOverlay.classList.add('hidden');
            }

            function showModal(modal) {
                modalBackdrop.classList.remove('hidden');
                modal.classList.remove('hidden');
            }

            function hideAllModals() {
                [addNodeModal, renameClusterModal, searchResultsModal, shareModal].forEach(m => m.classList.add('hidden')); // Added shareModal
                modalBackdrop.classList.add('hidden');
            }
            
            function openInfoPanel() {
                // Use a check for screen size to apply the correct open class
                if (window.innerWidth < 768) { // Mobile
                    infoPanel.classList.remove('translate-x-full'); // Remove the desktop close class
                    // The custom CSS now handles the translateY(0) transformation when translate-x-full is NOT present
                } else { // Desktop
                    infoPanel.classList.remove('translate-x-full'); 
                }
            }

            function closeInfoPanel() {
                // Use a check for screen size to apply the correct close class
                if (window.innerWidth < 768) { // Mobile
                    infoPanel.classList.add('translate-x-full'); // Add the desktop close class (which triggers mobile close in CSS)
                } else { // Desktop
                    infoPanel.classList.add('translate-x-full');
                }
                
                if (selectedNode) {
                    d3.select(`#node-${selectedNode.id}`).classed('selected', false);
                    selectedNode = null;
                }
                selectedCluster = null;
            }
            
            // --- STARFIELD BACKGROUND ---
            function setupStarfield() {
                const canvas = document.getElementById('stars-canvas');
                const ctx = canvas.getContext('2d');
                let stars = [];
                let numStars = 500;

                function resizeCanvas() {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    svg.attr('width', width).attr('height', height);
                    simulation.force("center", d3.forceCenter(width / 2, height / 2)).restart();
                    
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    stars = [];
                     for(let i = 0; i < numStars; i++) {
                        stars.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            radius: Math.random() * 1.5,
                            alpha: Math.random(),
                            speed: Math.random() * 0.2 + 0.1
                        });
                    }
                }
                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                function draw() {
                    if(ctx) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        stars.forEach(star => {
                            ctx.beginPath();
                            ctx.arc(star.x, star.y, star.radius, 0, 2 * Math.PI);
                            ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                            ctx.fill();

                            star.y -= star.speed;
                            if (star.y < 0) {
                                star.y = canvas.height;
                            }
                        });
                    }
                    requestAnimationFrame(draw);
                }
                draw();
            }


            // --- D3 RENDERING AND LOGIC ---
            function updateGraph(collectionData) {
                currentCollection = collectionData;
                currentNodes = collectionData.clusters.flatMap(c => 
                    c.nodes.map(n => ({...n, clusterId: c.id}))
                );

                const nodeMap = new Map(currentNodes.map(n => [n.id, n]));

                currentLinks = [];
                currentNodes.forEach(sourceNode => {
                    if (sourceNode.similar_to) {
                        sourceNode.similar_to.forEach(targetId => {
                            if (nodeMap.has(targetId)) {
                                currentLinks.push({ source: sourceNode.id, target: targetId });
                            }
                        });
                    }
                });

                node = node.data(currentNodes, d => d.id)
                    .join(
                        enter => {
                            const nodeEnter = enter.append("g")
                                .attr("class", "node")
                                .attr("id", d => `node-${d.id}`)
                                .call(drag(simulation));
                            
                            nodeEnter.append("circle")
                                .attr("r", 8)
                                .attr("fill", d => color(d.clusterId))
                                .on("click", handleNodeClick);

                            return nodeEnter;
                        },
                        update => update,
                        exit => exit.remove()
                    );
                
                link = link.data(currentLinks, d => `${d.source?.id}-${d.target?.id}`)
                    .join("line")
                    .attr("class", "link");

                const clusterData = currentCollection.clusters.map(c => ({
                    id: c.id,
                    name: c.name,
                    nodes: c.nodes
                }));
                
                label = label.data(clusterData, d => d.id)
                    .join("text")
                    .attr("class", "cluster-label")
                    .text(d => d.name)
                    .on("click", handleClusterClick);

                simulation.nodes(currentNodes);
                simulation.force("link").links(currentLinks);
                simulation.alpha(1).restart();
            }

            function ticked() {
                 link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node.attr("transform", d => `translate(${d.x}, ${d.y})`);
                
                const clusterCentroids = {};
                if (currentCollection) {
                    currentCollection.clusters.forEach(c => {
                        const clusterNodes = currentNodes.filter(n => n.clusterId === c.id);
                        if(clusterNodes.length > 0) {
                            const x = d3.mean(clusterNodes, n => n.x);
                            const y = d3.mean(clusterNodes, n => n.y);
                            clusterCentroids[c.id] = {x, y};
                        }
                    });
                }

                label.attr("x", d => clusterCentroids[d.id]?.x)
                     .attr("y", d => clusterCentroids[d.id]?.y);

                // Stronger custom force to center nodes around their cluster
                const clusterStrength = 0.1; 
                currentNodes.forEach(n => {
                    const centroid = clusterCentroids[n.clusterId];
                    if(centroid){
                        n.vx += (centroid.x - n.x) * clusterStrength;
                        n.vy += (centroid.y - n.y) * clusterStrength;
                    }
                });
            }

            // Drag handler with delete/merge logic
            function drag(simulation) {
                function dragstarted(event, d) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                    closeInfoPanel();
                }

                function dragged(event, d) {
                    d.fx = event.x;
                    d.fy = event.y;
                    
                    const draggedNodeElement = d3.select(this);
                    mergeTargetNode = null;

                    // Check for delete
                    if (event.x > width * DELETE_THRESHOLD) {
                        draggedNodeElement.classed('deleting', true);
                        deleteZone.classList.add('active');
                    } else {
                        draggedNodeElement.classed('deleting', false);
                        deleteZone.classList.remove('active');
                    }
                    
                    // Check for merge
                    d3.selectAll('.node').each(function(other_d) {
                        if (d.id === other_d.id) return;
                        const dist = Math.sqrt((d.fx - other_d.x)**2 + (d.fy - other_d.y)**2);
                        // Check if within a small radius AND nodes are from different clusters
                        if (dist < 20 && d.clusterId !== other_d.clusterId) {
                            mergeTargetNode = other_d;
                        }
                    });

                    if (mergeTargetNode) {
                         draggedNodeElement.classed('merging', true);
                         d3.select(`#node-${mergeTargetNode.id}`).classed('merging', true);
                         mergeZone.classList.add('active');
                    } else {
                        d3.selectAll('.node.merging').classed('merging', false);
                        mergeZone.classList.remove('active');
                    }
                }

                async function dragended(event, d) {
                    if (!event.active) simulation.alphaTarget(0);
                    
                    d3.select(this).classed('deleting merging', false);
                    deleteZone.classList.remove('active');
                    mergeZone.classList.remove('active');
                    d3.selectAll('.node.merging').classed('merging', false);

                    const finalX = event.x;

                    if (finalX > width * DELETE_THRESHOLD) {
                        d.fx = null; d.fy = null;
                        if (window.confirm(`Are you sure you want to delete "${d.title}"?`)) { // Using window.confirm temporarily, should be custom modal
                            await deleteNode(d.id);
                        }
                    } else if (mergeTargetNode) {
                         d.fx = null; d.fy = null;
                         if (window.confirm(`Merge "${currentCollection.clusters.find(c=>c.id === d.clusterId).name}" into "${currentCollection.clusters.find(c=>c.id === mergeTargetNode.clusterId).name}"?`)) { // Using window.confirm temporarily
                             await performMergeClusters(d.clusterId, mergeTargetNode.clusterId);
                         }
                    } else {
                        // Persist layout change if not deleting or merging
                        d.fx = null;
                        d.fy = null;
                        const nodeUpdateData = [{id: d.id, x: d.x, y: d.y}];
                        apiCall(`/api/collections/${currentCollection.id}/save`, 'POST', nodeUpdateData, false);
                    }
                    mergeTargetNode = null;
                }

                return d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended);
            }
            
            // --- EVENT HANDLERS ---
            function handleNodeClick(event, d) {
                event.stopPropagation();

                if (selectedNode) {
                    d3.select(`#node-${selectedNode.id}`).classed('selected', false);
                }
                selectedNode = d;
                selectedCluster = null;
                d3.select(this.parentNode).classed('selected', true);
                
                infoContent.innerHTML = `
                    <h2 class="text-2xl font-bold text-cyan-300 mb-2">${d.title}</h2>
                    <p class="text-sm text-gray-400 mb-4">ID: ${d.id}</p>
                    <p class="mb-4">${d.summary}</p>
                    <button id="delete-node-btn" data-node-id="${d.id}" class="w-full bg-red-600/70 hover:bg-red-500/80 text-white font-bold py-2 px-4 rounded transition">Delete Star</button>
                `;
                document.getElementById('delete-node-btn').onclick = () => {
                    if(window.confirm(`Are you sure you want to delete "${d.title}"?`)){ // Using window.confirm temporarily
                        deleteNode(d.id);
                    }
                };
                openInfoPanel();
            }
            
            function handleClusterClick(event, d){
                event.stopPropagation();
                selectedCluster = d;
                selectedNode = null;
                d3.selectAll('.node.selected').classed('selected', false);

                infoContent.innerHTML = `
                    <h2 class="text-2xl font-bold text-yellow-300 mb-2">${d.name}</h2>
                    <p class="text-sm text-gray-400 mb-4">Galaxy ID: ${d.id} | Contains ${d.nodes.length} stars</p>
                    <div class="flex flex-col gap-2">
                        <button id="rename-cluster-btn" class="w-full bg-blue-600/70 hover:bg-blue-500/80 text-white font-bold py-2 px-4 rounded transition">Rename Galaxy</button>
                    </div>
                `;
                
                document.getElementById('rename-cluster-btn').onclick = () => {
                    document.getElementById('rename-cluster-input').value = d.name;
                    document.getElementById('rename-cluster-id-hidden').value = d.id;
                    showModal(renameClusterModal);
                };

                openInfoPanel();
            }
            
            async function deleteNode(nodeId) {
                const result = await apiCall(`/api/collections/${currentCollection.id}/nodes/${nodeId}`, 'DELETE', null, true, 'Deleting star...');
                if(result !== null) {
                    showCustomMessage('Star successfully deleted.', 'success');
                    closeInfoPanel();
                    loadCollection(currentCollection.id, false); // No loader on refresh
                }
            }
            
            async function performMergeClusters(cluster2Id, cluster1Id) {
                const payload = {
                    collection_id: parseInt(currentCollection.id),
                    cluster1_id: cluster1Id,
                    cluster2_id: cluster2Id
                };
                const result = await apiCall('/api/clusters/merge', 'POST', payload, true, 'Merging galaxies...');
                if(result){
                    showCustomMessage('Galaxies successfully merged.', 'success');
                    loadCollection(currentCollection.id);
                }
            }
            
            async function performRecluster() {
                const collectionId = collectionSelector.value;
                const newCollectionData = await apiCall(`/api/ai/recluster/${collectionId}`, 'POST', null, true, 'Reclustering universe...');
                if (newCollectionData) {
                    showCustomMessage('Reclustering complete!', 'success');
                    updateGraph(newCollectionData);
                }
            }
            
            async function performSearch() {
                const query = searchInput.value;
                if (!query) return;
                const results = await apiCall(`/api/ai/query/${currentCollection.id}`, 'POST', {text: query}, true, 'Searching...');
                if(results) {
                    displaySearchResults(results);
                }
            }
            
            function displaySearchResults(results) {
                const contentEl = document.getElementById('search-results-content');
                if (results.length === 0) {
                    contentEl.innerHTML = '<p class="text-gray-400">No matching stars found.</p>';
                } else {
                    contentEl.innerHTML = results.map(r => `
                        <div class="p-3 mb-2 bg-gray-800/50 rounded-lg border border-white/10 hover:bg-gray-700/50 cursor-pointer search-result-item" data-node-id="${r.node.id}">
                            <h4 class="font-bold text-cyan-300">${r.node.title}</h4>
                            <p class="text-sm text-gray-300 truncate">${r.node.summary}</p>
                            <p class="text-xs text-green-400 mt-1">Similarity: ${(r.similarity_score * 100).toFixed(2)}%</p>
                        </div>
                    `).join('');
                    
                    document.querySelectorAll('.search-result-item').forEach(item => {
                        item.addEventListener('click', (e) => {
                            const nodeId = e.currentTarget.dataset.nodeId;
                            const targetNode = currentNodes.find(n => n.id === nodeId);
                            if(targetNode) {
                                const d3NodeElement = d3.select(`#node-${nodeId}`).select('circle').node();
                                if(d3NodeElement) d3NodeElement.dispatchEvent(new MouseEvent('click', {bubbles: true}));
                                hideAllModals();
                                const transform = d3.zoomIdentity.translate(width/2, height/2).scale(1.5).translate(-targetNode.x, -targetNode.y);
                                svg.transition().duration(750).call(zoom.transform, transform);
                            }
                        });
                    });
                }
                showModal(searchResultsModal);
            }
            
            async function createNewNode() {
                 const title = document.getElementById('new-node-title').value;
                 const summary = document.getElementById('new-node-summary').value;
                 if(!title || !summary) {
                     showCustomMessage('Title and Summary are required.', 'error');
                     return;
                 }
                 const newNodeData = { title, summary, collection_id: parseInt(currentCollection.id) };
                 const result = await apiCall(`/api/nodes`, 'POST', newNodeData, true, 'Creating new star...');
                 if(result){
                     showCustomMessage('New star created!', 'success');
                     hideAllModals();
                     loadCollection(currentCollection.id);
                 }
            }
            
             async function performRenameCluster() {
                const newName = document.getElementById('rename-cluster-input').value;
                const clusterId = document.getElementById('rename-cluster-id-hidden').value;
                if(!newName){ 
                    showCustomMessage('New name cannot be empty.', 'error'); 
                    return; 
                }
                const payload = {
                    collection_id: parseInt(currentCollection.id),
                    cluster_id: parseInt(clusterId),
                    new_name: newName
                };
                const result = await apiCall('/api/clusters/rename', 'POST', payload, true, 'Renaming galaxy...');
                if(result){
                    showCustomMessage(`Galaxy renamed to "${newName}".`, 'success');
                    hideAllModals();
                    closeInfoPanel();
                    loadCollection(currentCollection.id);
                }
             }
             
            // NEW: Function to handle the Share button click and display the modal
            function handleShareClick() {
                if (!currentCollection) {
                    showCustomMessage("Please select a collection first.", 'info');
                    return;
                }

                // Mock URL based on current collection ID and selected access level
                const updateShareLink = () => {
                    const accessType = document.querySelector('input[name="access-type"]:checked').value;
                    let mockUrl = `https://galaxy.app/explore/${currentCollection.id}`;
                    if (accessType === 'edit') {
                        mockUrl += `?access=edit&token=mock-auth`;
                    } else {
                        mockUrl += `?access=view`;
                    }
                    shareLinkOutput.value = mockUrl;
                };

                // Initial setup
                updateShareLink();
                
                // Add listeners to radio buttons (if not already added)
                document.querySelectorAll('input[name="access-type"]').forEach(radio => {
                    radio.onchange = updateShareLink;
                });
                
                showModal(shareModal);
            }
            
            // NEW: Function to copy the link to the clipboard
            function copyShareLink() {
                const shareText = shareLinkOutput.value;
                try {
                    // Fallback using deprecated method for canvas/iframe compatibility
                    const input = document.createElement('textarea');
                    input.value = shareText;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    showCustomMessage("Share link copied to clipboard!", 'success');
                } catch (e) {
                     showCustomMessage("Error: Could not access clipboard.", 'error');
                }
            }


            // --- INITIALIZATION ---
            async function loadCollection(id, showLoader = true) {
                const collections = await apiCall('/api/collections', 'GET', null, showLoader, 'Loading Universe...');
                if (collections) {
                    const collectionData = collections.find(c => c.id == id);
                    if (collectionData) {
                        updateGraph(collectionData);
                    } else {
                        console.error("Collection not found for ID:", id);
                    }
                }
            }

            async function initialize() {
                setupStarfield();
                const collections = await apiCall('/api/collections', 'GET');
                if (collections && collections.length > 0) {
                    collectionSelector.innerHTML = collections.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                    loadCollection(collections[0].id, false);
                } else {
                    hideLoader();
                    svg.append("text")
                       .attr("x", width/2).attr("y", height/2)
                       .attr("text-anchor", "middle").attr("fill", "white")
                       .style("font-size", "20px")
                       .text("No collections found. Is the backend running?");
                }
            }

            // --- RAG + LLM HANDLING ---
            const ragModal = document.getElementById('rag-llm-modal');
            const ragBtn = document.getElementById('rag-llm-btn');
            const ragQueryInput = document.getElementById('rag-query-input');
            const ragResponseContainer = document.getElementById('rag-response-container');
            const ragResponse = document.getElementById('rag-response');
            const cancelRagQuery = document.getElementById('cancel-rag-query');
            const submitRagQuery = document.getElementById('submit-rag-query');

            ragBtn.addEventListener('click', () => {
            ragQueryInput.value = '';
            ragResponseContainer.classList.add('hidden');
            showModal(ragModal);
            });

            cancelRagQuery.addEventListener('click', () => {ragModal.classList.add('hidden');modalBackdrop.classList.add('hidden');});
            // Changed modal backdrop close listener to check if the clicked modal is one of the main ones
            modalBackdrop.addEventListener('click', () => {
                // If rag modal is open, close it. Otherwise, hide all.
                if (!ragModal.classList.contains('hidden')) {
                     ragModal.classList.add('hidden');
                     modalBackdrop.classList.add('hidden');
                } else {
                     hideAllModals();
                }
            });

            submitRagQuery.addEventListener('click', async () => {
            const query = ragQueryInput.value.trim();
            if (!query) return alert("Please enter a query first!");
            ragResponseContainer.classList.add('hidden');
            showLoaderWithMessage('Consulting the galaxy...');
            try {
                const res = await apiCall(`/api/rag/query/${currentCollection.id}`, 'POST', { query }, false);
                hideLoader();
                if (res && res.response) {
                ragResponse.textContent = '';
                ragResponseContainer.classList.remove('hidden');
                // Typing animation
                let i = 0;
                const text = res.response;
                const interval = setInterval(() => {
                    ragResponse.textContent += text[i];
                    i++;
                    if (i >= text.length) clearInterval(interval);
                }, 20);
                } else {
                ragResponseContainer.classList.remove('hidden');
                ragResponse.textContent = "No response received. (Placeholder endpoint)";
                }
            } catch (err) {
                hideLoader();
                alert("Error querying the galaxy!");
            }
            });

            
            // --- EVENT LISTENERS ---
            collectionSelector.addEventListener('change', (e) => loadCollection(e.target.value));
            reclusterBtn.addEventListener('click', performRecluster);
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') performSearch();
            });
            
            // Share Modal Listeners
            shareLinkBtn.addEventListener('click', handleShareClick); // Replaced old placeholder with new function
            closeShareModalBtn.addEventListener('click', hideAllModals);
            copyLinkBtn.addEventListener('click', copyShareLink);

            closePanelBtn.addEventListener('click', closeInfoPanel);
            
            addNodeBtn.addEventListener('click', () => showModal(addNodeModal));
            cancelAddNodeBtn.addEventListener('click', hideAllModals);
            // Removed modalBackdrop.addEventListener('click', hideAllModals) here, it was moved and refined above.
            confirmAddNodeBtn.addEventListener('click', createNewNode);
            
            cancelRenameClusterBtn.addEventListener('click', hideAllModals);
            confirmRenameClusterBtn.addEventListener('click', performRenameCluster);
            
            closeSearchResultsBtn.addEventListener('click', hideAllModals);

            

            // --- START ---
            initialize();
        });
    </script>
